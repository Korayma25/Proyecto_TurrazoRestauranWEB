<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turrazo Restaurant - Mi Carrito</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/carrito.css">
</head>
<body>
    <div id="navbar-placeholder"></div>
    <main class="container my-5">
        <h2 class="mb-4">Tu Carrito de Compras</h2>
        <div id="cart-container" class="row"></div>
        <div id="cart-summary" class="card p-4 mt-4 shadow-sm d-none">
            <div class="d-flex justify-content-between align-items-center">
                <h4>Total a Pagar: $<span id="cart-total-amount">0.00</span></h4>
                <div>
                    <button id="btn-clear-cart" class="btn btn-outline-danger me-2">Vaciar Carrito</button>
                    <a href="checkout.html" class="btn btn-success">Continuar al Pago</a>
                </div>
            </div>
        </div>
    </main>
    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/cart.js"></script>
    <script>
        function renderCartView() {
            const cart = getCart();
            const container = document.getElementById('cart-container');
            const summary = document.getElementById('cart-summary');
            const totalAmount = document.getElementById('cart-total-amount');

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <p class="text-muted fs-5">Tu carrito está vacío.</p>
                        <a href="restaurantes.html" class="btn btn-primary">Ver Restaurantes</a>
                    </div>
                `;
                summary.classList.add('d-none');
                return;
            }

            summary.classList.remove('d-none');
            let html = '<div class="col-lg-8"><ul class="list-group mb-3">';

            cart.forEach(item => {
                html += `
                    <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                        <div class="d-flex align-items-center">
                            <img src="${item.imagen}" alt="${item.nombre}" style="width: 60px; height: 60px; object-fit: cover;" class="rounded me-3">
                            <div>
                                <h6 class="my-0">${item.nombre}</h6>
                                <small class="text-muted">Precio: $${item.precio.toFixed(2)}</small>
                            </div>
                        </div>
                        <div class="d-flex align-items-center">
                            <button class="btn btn-sm btn-outline-secondary me-2" onclick="updateQty('${item.id}', -1)">-</button>
                            <span class="fw-bold">${item.quantity}</span>
                            <button class="btn btn-sm btn-outline-secondary ms-2" onclick="updateQty('${item.id}', 1)">+</button>
                            <span class="ms-4 fw-bold">$${(item.precio * item.quantity).toFixed(2)}</span>
                            <button class="btn btn-sm text-danger ms-3" onclick="removeItem('${item.id}')">Eliminar</button>
                        </div>
                    </li>
                `;
            });

            html += '</ul></div>';
            container.innerHTML = html;
            totalAmount.textContent = getCartTotal().toFixed(2);
        }

        function updateQty(id, delta) {
            changeQuantity(id, delta);
            renderCartView();
        }

        function removeItem(id) {
            removeFromCart(id);
            renderCartView();
        }

        document.getElementById('btn-clear-cart').addEventListener('click', () => {
            clearCart();
            renderCartView();
        });

        document.addEventListener('DOMContentLoaded', renderCartView);
    </script>
</body>
</html>
