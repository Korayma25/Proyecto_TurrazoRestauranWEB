<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Turrazo Restaurant</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilos globales y propios -->
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/checkout.css">
</head>
<body>

    <header>
        <!-- Navbar dinámico cargado desde main.js -->
    </header>

    <main class="container seccion">
        <h1 class="mb-4 text-center">Finalizar compra</h1>

        <div class="row g-4">
            <!-- Formulario de datos del cliente -->
            <section class="col-lg-7">
                <div class="card p-4 shadow-sm border-0">
                    <h2 class="h4 mb-3">Datos de entrega y pago</h2>

                    <form id="formulario-checkout" class="needs-validation" novalidate>
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre completo *</label>
                            <input type="text" class="form-class form-control" id="nombre" name="nombre" required placeholder="Ej. Juan Pérez">
                            <div class="invalid-feedback">Por favor, ingresa tu nombre completo.</div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="correo" class="form-label">Correo electrónico *</label>
                                <input type="email" class="form-control" id="correo" name="correo" required placeholder="ejemplo@correo.com">
                                <div class="invalid-feedback">Ingresa un correo electrónico válido.</div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="telefono" class="form-label">Teléfono *</label>
                                <input type="tel" class="form-control" id="telefono" name="telefono" required pattern="[0-9]{9,10}" placeholder="Ej. 0991234567">
                                <div class="invalid-feedback">Ingresa un número de teléfono válido (9 a 10 dígitos).</div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="direccion" class="form-label">Dirección de entrega *</label>
                            <input type="text" class="form-control" id="direccion" name="direccion" required placeholder="Calle principal, secundaria y número de casa">
                            <div class="invalid-feedback">La dirección es obligatoria.</div>
                        </div>

                        <div class="mb-3">
                            <label for="metodo-pago" class="form-label">Método de pago simulado *</label>
                            <select class="form-select" id="metodo-pago" name="metodo-pago" required>
                                <option value="" selected disabled>Selecciona una opción</option>
                                <option value="efectivo">Efectivo contra entrega</option>
                                <option value="tarjeta">Tarjeta de crédito/débito (Simulado)</option>
                            </select>
                            <div class="invalid-feedback">Selecciona un método de pago.</div>
                        </div>

                        <div class="mb-4">
                            <label for="notas" class="form-label">Notas o indicaciones adicionales (opcional)</label>
                            <textarea class="form-control" id="notas" name="notas" rows="2" placeholder="Ej. Timbre 2B, salsa extra..."></textarea>
                        </div>

                        <button type="submit" class="btn btn-turrazo w-100 py-2">
                            Confirmar pedido
                        </button>
                    </form>
                </div>
            </section>

            <!-- Resumen del pedido -->
            <section class="col-lg-5">
                <div class="card p-4 shadow-sm border-0 bg-white">
                    <h2 class="h4 mb-3">Resumen del pedido</h2>

                    <div id="resumen-pedido" class="mb-3">
                        <!-- Se llena dinámicamente desde JS -->
                        <p class="text-muted">Cargando productos...</p>
                    </div>

                    <hr>

                    <div class="d-flex justify-content-between align-items-center fw-bold fs-5">
                        <span>Total:</span>
                        <span id="total-pedido" class="texto-primario">$0.00</span>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Scripts compartidos y del módulo -->
    <script src="../js/main.js"></script>
    <script src="../js/checkout.js"></script>
</body>
</html>
