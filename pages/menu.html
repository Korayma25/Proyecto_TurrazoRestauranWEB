<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú de Productos - Turrazo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/menu.css">
</head>
<body>
    <header class="bg-dark text-white py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="../index.html" class="text-white text-decoration-none h4 m-0">Turrazo</a>
            <nav>
                <a href="restaurantes.html" class="text-white me-3 text-decoration-none">Restaurantes</a>
                <a href="menu.html" class="text-white me-3 text-decoration-none fw-bold">Menú</a>
                <a href="checkout.html" class="text-white text-decoration-none">Carrito</a>
            </nav>
        </div>
    </header>

    <main class="container my-4">
        <h1 class="mb-4 text-center">Menú de Productos</h1>

        <!-- Filtros y Buscador -->
        <section class="row g-3 mb-4">
            <div class="col-md-6">
                <input type="text" id="buscador" class="form-control" placeholder="Buscar producto por nombre...">
            </div>
            <div class="col-md-6">
                <select id="filtroCategoria" class="form-select">
                    <option value="todos">Todas las categorías</option>
                    <option value="entradas">Entradas</option>
                    <option value="platos_fuertes">Platos Fuertes</option>
                    <option value="bebidas">Bebidas</option>
                    <option value="postres">Postres</option>
                </select>
            </div>
        </section>

        <!-- Mensaje de sin resultados -->
        <div id="sinResultados" class="alert alert-warning text-center d-none" role="alert">
            No se encontraron productos que coincidan con la búsqueda.
        </div>

        <!-- Contenedor dinámico de productos -->
        <section id="listaProductos" class="row g-4"></section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/menu.js"></script>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toastAgregar" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    🛒 ¡Producto agregado al carrito con éxito!
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>
</body>
</html>
