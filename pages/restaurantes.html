<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Restaurantes - Turrazo</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Estilos globales de Turrazo -->
    <link rel="stylesheet" href="../css/styles.css">

    <!-- Estilos específicos de restaurantes -->
    <link rel="stylesheet" href="../css/restaurantes.css">
</head>

<body>

    <main class="container seccion">

        <!-- Título -->
        <div class="titulo-seccion">
            <h1>Restaurantes</h1>
            <p class="texto-gris">
                Encuentra tu restaurante favorito
            </p>
        </div>

        <!-- Buscador y filtro -->
        <section class="filtros-restaurantes mb-5">

            <div class="row">

                <div class="col-md-6 mb-3 mb-md-0">
                    <label for="buscador" class="form-label">
                        Buscar restaurante
                    </label>

                    <input
                        type="text"
                        id="buscador"
                        class="form-control"
                        placeholder="Buscar por nombre..."
                    >
                </div>

                <div class="col-md-6">
                    <label for="filtroCocina" class="form-label">
                        Tipo de cocina
                    </label>

                    <select id="filtroCocina" class="form-select">
                        <option value="todos">Todos</option>
                    </select>
                </div>

            </div>

        </section>

        <!-- Lista de restaurantes -->
        <section>

            <div id="listaRestaurantes" class="row g-4">
                <!-- Las tarjetas se generan mediante JavaScript -->
            </div>

            <!-- Mensaje cuando no existen resultados -->
            <div id="sinResultados" class="estado-vacio d-none">
                <h3>No se encontraron restaurantes</h3>

                <p>
                    Intenta cambiar el nombre o el tipo de cocina.
                </p>
            </div>

        </section>

    </main>

    <!-- JavaScript global -->
    <script src="../js/main.js"></script>

    <!-- JavaScript de restaurantes -->
    <script src="../js/restaurantes.js"></script>

</body>

</html>
